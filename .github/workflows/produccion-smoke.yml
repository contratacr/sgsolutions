name: Comprobación breve de producción
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: produccion-smoke
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Seis consultas HTTP sin escrituras ni proveedores
        run: node scripts/testing/produccion-smoke.mjs
        env:
          SG_PRODUCCION_SMOKE: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: produccion-smoke
          path: .privado/evidencias/produccion-smoke.json
          retention-days: 7
          if-no-files-found: ignore
