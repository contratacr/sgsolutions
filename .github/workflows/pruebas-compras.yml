name: Pruebas de compras sin cobros
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compras-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compras:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verificar código y traducciones
        run: npm run verificar
      - name: Probar rendimiento del catálogo y estabilidad de enlaces
        run: npx playwright test --config=playwright.catalogo.config.ts
      - name: Probar acceso Google con proveedor simulado
        run: npx playwright test --config=playwright.google.config.ts
      - name: Probar actualización manual de Eurocomp sin consultas reales
        run: npx playwright test --config=playwright.eurocomp-manual.config.ts
      - name: Probar estadísticas y filtros del panel
        run: npx playwright test --config=playwright.estadisticas.config.ts
      - name: Probar edición de contenido y casos con datos aislados
        run: npx playwright test --config=playwright.contenido.config.ts
      - name: Probar catálogo recomendado y validación de datos en Chrome y Safari
        run: npx playwright test --config=playwright.checkout-ui.config.ts
      - name: Selector de comprobantes en escritorio y móvil
        run: npx playwright test --config=playwright.comprobantes.config.ts
      - name: Pago con tarjeta directo (simulado)
        run: npx playwright test --config=playwright.tarjeta-directa.config.ts
      - name: Probar modales, favoritos y desplazamiento del catálogo
        run: npx playwright test --config=playwright.modales.config.ts
      - name: Probar confirmaciones reales y simuladas sin pagos
        run: npx playwright test --config=playwright.confirmaciones.config.ts
      - name: Probar estados independientes de pago y entrega en Chrome y Safari
        run: npx playwright test --config=playwright.entrega.config.ts
      - name: Crear Supabase efímero y aplicar las migraciones
        run: |
          npx supabase start > "$RUNNER_TEMP/supabase-inicio.log" 2>&1
          npx supabase status --output json > "$RUNNER_TEMP/sg-base-local.json"
          chmod 600 "$RUNNER_TEMP/sg-base-local.json"
      - name: Probar el Worker compilado y compras simuladas
        run: npm run test:compras
        env:
          TEST_SUPABASE_CONFIG: ${{ runner.temp }}/sg-base-local.json
          WRANGLER_SEND_METRICS: "false"
      - name: Guardar resumen sin credenciales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-compras-simuladas
          path: .privado/evidencias/compras-worker.json
          if-no-files-found: ignore
      - name: Guardar evidencias cuando falle una prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pruebas
          path: test-results/
          if-no-files-found: ignore
      - name: Detener la base efímera
        if: always()
        run: npx supabase stop --no-backup
