project_id = "sgsolutions-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3107"
additional_redirect_urls = ["http://127.0.0.1:3107", "http://127.0.0.1:3107/cuenta/confirmar", "http://127.0.0.1:3107/cuenta/confirmar?flujo=recuperar"]
jwt_expiry = 3600
minimum_password_length = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false
