project_id = "sgsolutions-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3107"
additional_redirect_urls = ["http://127.0.0.1:3107", "http://127.0.0.1:3107/cuenta/confirmar", "http://127.0.0.1:3107/cuenta/confirmar?flujo=recuperar"]
jwt_expiry = 3600
minimum_password_length = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false

[auth.email.template.confirmation]
subject = "Confirme su correo / Confirm your email | SG Solutions"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recupere su contraseña / Reset your password | SG Solutions"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Acceda a su cuenta / Sign in to your account | SG Solutions"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Su cuenta en SG Solutions / Your SG Solutions account | SG Solutions"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirme el cambio de correo / Confirm your email change | SG Solutions"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Verifique su identidad / Verify your identity | SG Solutions"
content_path = "./supabase/templates/reauthentication.html"
