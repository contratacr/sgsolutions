name: Respaldo diario cifrado
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: respaldo-diario
  cancel-in-progress: false
jobs:
  respaldar:
    if: vars.RESPALDOS_ACTIVOS == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: respaldos
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESPALDO_AGE_RECIPIENT: ${{ vars.RESPALDO_AGE_RECIPIENT }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET_RESPALDOS: ${{ vars.R2_BUCKET_RESPALDOS }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash scripts/respaldo-ci.sh
